summary: >-
  Lavante operated as an independent SaaS supplier information management and profit-recovery vendor,
  was acquired by PRGX Global, ran on for several years as a PRGX-owned brand and site, and was then
  fully retired into a domain redirect. The supplier-facing capability survives inside PRGX as
  Supplier Connect. No public API, developer portal, versioning policy, deprecation policy, SLA or
  status page was ever published under the lavante.com domain.


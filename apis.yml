name: Lavante
description: 'Lavante was a SaaS supplier information management (SIM) and profit-recovery company built
  on its patented Lavante Connect platform. Its products — Lavante SIM, Lavante Recovery and Vendor File
  Cleanse — cleansed vendor master files, verified addresses and TINs, ran OFAC screening, onboarded
  suppliers onto the Lavante Supplier Network, and drove dispute resolution and recovery audit across the
  procure-to-pay (P2P) ecosystem for Fortune 1000 clients in hospitality, retail, entertainment,
  manufacturing and medical. Lavante was acquired by PRGX Global and its standalone site was retired;
  www.lavante.com now 302-redirects to www.prgx.com, where the supplier-facing capability lives on as PRGX
  Supplier Connect. Lavante never published a public API, developer portal, SDKs or API documentation —
  the Internet Archive holds no api/developer/docs/swagger paths for the domain.'
